<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="/styles/style.css">
    <script src="/main.js" defer></script>
</head>
<body>
    <div id="loading-page-container">
        <h1>Analysing Document...</h1>

        <ul id="progress-steps">
             <li id="step-1" class="active">
                 <div class="step-header">
                     <span class="step-icon">1</span>
                     <span class="step-text">Extracting revision history and text...</span>
                 </div>
                 <div class="progress-track"><div class="progress-fill" id="progress-1"></div></div>
            </li>
            <li id="step-2">
                <div class="step-header">
                    <span class="step-icon">2</span>
                    <span class="step-text">Running AI analysis...</span>
                </div>
                <div class="progress-track"><div class="progress-fill indeterminate" id="progress-2"></div></div>
            </li>
            <li id="step-3">
                <div class="step-header">
                    <span class="step-icon">3</span>
                    <span class="step-text">Generating Charts...</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="progress-3"></div></div>
            </li>
            <li id="step-4">
                <div class="step-header">
                    <span class="step-icon">4</span>
                    <span class="step-text">Compiling PDF report...</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="progress-4"></div></div>
            </li>
        </ul>
        
        <div id="status-text"></div>
        <div id="queue-info" class="queue-info" style="display:none;">
            <p id="queue-detail">Your document is currently in the queue.</p>
            <p id="queue-position" class="queue-position"></p>
        </div>
        <div id="loading-status-text">This would take some time...</div>
        <button id="cancel-button">Cancel and go back</button>
    </div>
</body>
</html>
