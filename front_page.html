<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroGPT Document Checker</title>
    <!--Icon Library for arrow button-->
    <link rel="stylesheet" href="https:cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div id="front-page-container">  
        <h1>ZeroGPT Document Checker</h1>
        <p>Insert Google document link here:</p>
        <input type="text" placeholder="https://docs.google.com/document/d/...">
        <button class="arrow-btn">
            <!--Name of arrow icon from the icon library-->
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

</body>
</html>
